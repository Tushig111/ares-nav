<!doctype html><meta charset="utf-8"><title>Layer visibility regression</title><script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script><h1>Layer visibility regression</h1><pre id="results">Running…</pre><script type="module">
import * as THREE from 'three';import {OrbitControls}from'three/addons/controls/OrbitControls.js';import {createProjectionController}from'../js/projections.js?v=gis2';import{MarsQuadtreeGlobe,spherePoint,rectanglePoint}from'../js/mars-quadtree-globe.js?v=gis2';import{localToMars}from'../js/science-model.js?v=gis2';
const checks=[],check=(name,pass)=>{checks.push({name,pass:!!pass});if(!pass)throw Error(name);};
try{
const canvas=document.createElement('canvas');canvas.style.width='800px';canvas.style.height='600px';document.body.append(canvas);const camera=new THREE.PerspectiveCamera(42,4/3,.01,1600),globe=new THREE.Group(),renderer={domElement:canvas,capabilities:{getMaxAnisotropy:()=>1},initTexture(){}};camera.position.set(0,3.2,13.5);const q=new MarsQuadtreeGlobe({parent:globe,camera,renderer,createImage:()=>({width:256,height:256,src:''})});const controls=new OrbitControls(camera,canvas);controls.minDistance=4.64;controls.maxDistance=30;let paused=0;const projection=createProjectionController({camera,controls,globe,tiles:q,enterOrbital(){},pauseMotion(){paused++;}});const site={lat:-4.5895,lon:137.4417};
const spans=()=>{globe.updateWorldMatrix(true,true);camera.updateMatrixWorld();const corners=[[-52,-52],[52,-52],[-52,52],[52,52]].map(([x,z])=>{const p=localToMars(x,z,site);return q.point(p.lat,p.lon).applyMatrix4(q.group.matrixWorld).project(camera);});return {w:Math.max(...corners.map(p=>p.x))-Math.min(...corners.map(p=>p.x)),h:Math.max(...corners.map(p=>p.y))-Math.min(...corners.map(p=>p.y)),corners};};
projection.flyTo({...site,inspectionMeters:2496});for(let i=0;i<90;i++)projection.update(.05);let screen=spans();check('Globe inspection makes local footprint at least 150px tall',screen.h*300>150);check('Globe footprint fits inside viewport',screen.corners.every(p=>Math.abs(p.x)<1&&Math.abs(p.y)<1&&Math.abs(p.z)<1));check('Inspection uses real perspective magnification',camera.zoom>1);check('Inspection stops automatic motion',paused>0);q.updateDirect(site.lat,site.lon,1,0,11);const detailed=q.targetLevel;camera.zoom=1;q.updateDirect(site.lat,site.lon,1,0,11);check('LOD accounts for perspective camera zoom',detailed>q.targetLevel);
projection.wholeGlobe();check('Whole globe resets magnification',camera.zoom===1&&camera.position.distanceTo(controls.target)>13);projection.flyTo(site);for(let i=0;i<90;i++)projection.update(.05);check('Ordinary POI flight uses normal magnification',camera.zoom===1);
projection.setMode('rectangle');projection.flyTo({...site,inspectionMeters:2496});for(let i=0;i<90;i++)projection.update(.05);screen=spans();check('Rectangle inspection footprint is visible',screen.h*300>150);check('Rectangle inspection fits viewport',screen.corners.every(p=>Math.abs(p.x)<1&&Math.abs(p.y)<1));projection.wholeGlobe();check('Whole globe exits rectangle cleanly',projection.mode==='global'&&camera.zoom===1&&camera.isPerspectiveCamera);camera.zoom=8;projection.reset();check('Surface-mode reset clears inspection magnification',camera.zoom===1);
document.getElementById('results').textContent=JSON.stringify({passed:checks.length,total:checks.length,checks},null,2);
}catch(error){document.getElementById('results').textContent=JSON.stringify({error:error.stack,checks},null,2);}
</script>
