<!doctype html><meta charset="utf-8"><title>ARES zoom transition checks</title><script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script><style>body{font:14px/1.6 monospace;background:#080c15;color:#e5edf5;padding:24px}.pass{color:#65efbb}.fail{color:#ff8a8a}</style><h1>Zoom transition checks</h1><p id="summary">Loading Three.js…</p><ol id="results"></ol><script type="module">import{runZoomTransitionTests}from'./zoom-transition-tests.js';const r=runZoomTransitionTests();for(const t of r){const li=document.createElement('li');li.className=t.passed?'pass':'fail';li.textContent=`${t.passed?'PASS':'FAIL'}: ${t.name}${t.error?' — '+t.error:''}`;document.querySelector('#results').append(li);}document.querySelector('#summary').textContent=`${r.filter(x=>x.passed).length}/${r.length} passed (real Three.js geometry, simulated image delivery and GPU upload)`;</script>
