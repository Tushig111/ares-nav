<!doctype html><meta charset="utf-8"><title>ARES bitmap and pin GPU checks</title><script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script><h1>Actual bitmap / pin framebuffer checks</h1><pre id="result">Running…</pre><script type="module">

const renderer=new THREE.WebGLRenderer({antialias:false,preserveDrawingBuffer:true});renderer.setSize(64,64);document.body.append(renderer.domElement);const target=new THREE.WebGLRenderTarget(64,64),scene=new THREE.Scene(),camera=new THREE.OrthographicCamera(-1,1,1,-1,.01,10);camera.position.z=3;camera.lookAt(0,0,0);
const source=document.createElement('canvas');source.width=source.height=4;const c=source.getContext('2d');c.fillStyle='red';c.fillRect(0,0,4,2);c.fillStyle='blue';c.fillRect(0,2,4,2);const blob=await new Promise(resolve=>source.toBlob(resolve)),bitmap=await createImageBitmap(blob,{imageOrientation:'flipY',premultiplyAlpha:'none'}),texture=new THREE.Texture(bitmap);texture.flipY=false;texture.colorSpace=THREE.SRGBColorSpace;texture.needsUpdate=true;texture.magFilter=texture.minFilter=THREE.NearestFilter;
