<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>ARES mission upgrade checks</title><script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script><h1>Direct LOD and visible pins</h1><pre id="results">Running…</pre><script type="module">
import{landmarkBadge}from'../js/official-data.js';import * as THREE from 'three';import {MarsQuadtreeGlobe,FADE_MS,spherePoint,rectanglePoint} from '../js/mars-quadtree-globe.js';import {createProjectionController} from '../js/projections.js';import{createMeasurementTools}from'../js/measurement-tools.js';import{OrbitControls}from'three/addons/controls/OrbitControls.js';
const results=[],check=(name,fn)=>{try{fn();results.push({name,passed:true});}catch(e){results.push({name,passed:false,error:e.message});}document.querySelector('#results').textContent=JSON.stringify({passed:results.filter(r=>r.passed).length,total:results.length,results},null,2);},assert=(v,m='Assertion failed')=>{if(!v)throw Error(m);};let now=0;const images=[];check('Gazetteer features carry the official IAU badge',()=>assert(landmarkBadge({kind:'feature',id:'iau-14300'}).includes('OFFICIAL')));check('Supplied mission waypoints never receive an official badge',()=>assert(!landmarkBadge({kind:'poi',id:'bookmark-1-0',sourceURL:'https://science.nasa.gov/'}).includes('OFFICIAL')));
const canvas=document.createElement('canvas');canvas.width=800;canvas.height=600;canvas.style.width='800px';canvas.style.height='600px';document.body.append(canvas);const camera=new THREE.PerspectiveCamera(42,4/3,.01,1600),globe=new THREE.Group(),renderer={domElement:canvas,capabilities:{getMaxAnisotropy:()=>1},initTexture(){}};
const q=new MarsQuadtreeGlobe({parent:globe,camera,renderer,now:()=>now,createImage:()=>{const image={width:256,height:256,src:''};images.push(image);return image;}});const controls=new OrbitControls(camera,canvas),projection=createProjectionController({camera,controls,globe,tiles:q,enterOrbital(){},pauseMotion(){}});
camera.position.copy(spherePoint(0,0,4.64));camera.lookAt(0,0,0);camera.updateMatrixWorld();
projection.setMode('rectangle');camera.zoom=32768;camera.updateProjectionMatrix();camera.updateMatrixWorld();q.update();check('Target L11 and L10 are requested on the first deep-zoom update',()=>assert([...q.fastWanted].some(k=>k.startsWith('ctx/11/'))&&[...q.fastWanted].some(k=>k.startsWith('ctx/10/'))));
check('Direct family remains bounded at eight keys and twelve active workers',()=>assert(q.fastWanted.size===8&&q.active<=12));
check('Pending target imagery never makes a placeholder overlay visible',()=>assert([...q.fastNodes.values()].every(n=>!n.mesh?.visible)));
// Deliver all requests instantly; the benchmark excludes network transfer time by design.
for(let frame=0;frame<18;frame++){for(const image of images)if(image.onload)image.onload();now+=16;q.update();}
check('Ready target imagery becomes visible within 288ms with instant image delivery',()=>assert([...q.fastNodes.values()].some(n=>n.z===11&&n.mesh?.visible&&n.opacity===1)));
check('Fast overlay never hides the regular reference roots',()=>assert(q.roots.every(n=>n.mesh?.visible||n.split)));
check('The configured temporal blend is 90ms',()=>assert(FADE_MS===90));check('Uploaded and in-flight textures remain within 220 entries',()=>assert(q.cache.size+q.active<=220));
const host=document.createElement('section');host.innerHTML='<output data-measure-output></output><div data-vertices></div><select data-measure-mode><option>inspect</option><option>line</option></select><input type="checkbox" data-measure-enable><input type="checkbox" data-longitude><input data-lat><input data-lon><input data-edit-index>'+['add-coordinate','undo','redo','clear','export','share'].map(x=>`<button data-${x}>${x}</button>`).join('');document.body.append(host);
const api={camera,globe,tiles:q,canvas,controls,radius:4.6,getState:()=>({mode:'orbital'}),cancelWaypoint(){},download(){},getView(){},restoreView(){},globePoint:(lat,lon,r)=>{if(!q.rectangle)return spherePoint(lat,lon,r);const p=rectanglePoint(lat,lon,4.6);p.z=r-4.6;return p.applyQuaternion(q.group.quaternion);}};const measure=createMeasurementTools(api,host);
for(const [mode,lat,lon]of[['global',0,0],['rectangle',18,77],['north',80,30],['south',-80,-120]]){
 projection.setMode(mode);host.querySelector('[data-lat]').value=lat;host.querySelector('[data-lon]').value=lon;host.querySelector('[data-add-coordinate]').click();measure.refresh();camera.updateMatrixWorld();globe.updateWorldMatrix(true,true);measure.update();
 check(mode+' pins use the exact active projection transformer and a +0.004 offset',()=>{const group=q.group.children.find(g=>g.isGroup),dot=group.children.filter(x=>x.userData.marker).at(-1),expected=q.point(lat,lon);if(q.rectangle)expected.z=.004;else expected.normalize().multiplyScalar(4.604);assert(dot.position.distanceTo(expected)<1e-8);assert(dot.material.depthTest===false&&dot.material.depthWrite===false&&dot.material.transparent===true&&dot.renderOrder===999);});
 check(mode+' Add Pin creates an HTML badge for each recorded coordinate',()=>assert(document.querySelectorAll('.pin-badge').length===measure.snapshot().points.length));
}
measure.clear();check('Clear removes pin beacons and HTML badges together',()=>assert(document.querySelectorAll('.pin-badge').length===0));q.dispose();
</script>
