<!doctype html><html><head><meta charset="utf-8"><title>Scientific GIS verification</title><script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script></head><body><h1>Scientific GIS verification</h1><pre id="result">Running…</pre><div id="layer-list"></div><div id="host"></div><script type="module">
import * as THREE from 'three';
import {createScientificLayerManager} from '../js/scientific-layer-manager.js?v=gis2';
import {spherePoint,rectanglePoint} from '../js/mars-quadtree-globe.js?v=gis2';
import {SCIENCE_IDS,localToMars,compareRoute} from '../js/science-model.js?v=gis2';
const checks=[],check=(name,pass)=>{checks.push({name,pass:!!pass});if(!pass)throw Error(name);},wait=async(fn)=>{for(let i=0;i<400;i++){if(fn())return;await new Promise(r=>setTimeout(r,10));}throw Error('Timeout waiting for grid');};
try{
const scene=new THREE.Scene(),surfaceGroup=new THREE.Group(),routeGroup=new THREE.Group(),group=new THREE.Group();scene.add(surfaceGroup,group);surfaceGroup.add(routeGroup);
const state={mode:'orbital',siteIndex:0,relief:1,weatherPreset:'clear',waypoints:[{x:0,z:0},{x:10,z:0}]},site={id:0,lat:0,lon:179.999,shortName:'Test site'},sample=(x,z)=>({h:x*.1,height:x*.1,slope:5.71,featureMask:(Math.sin(x)+1)/2});let optimized=0;
const api={surfaceGroup,routeGroup,tiles:{group,rectangle:false,point:(lat,lon)=>api.tiles.rectangle?rectanglePoint(lat,lon,4.6):spherePoint(lat,lon,4.6),setLayer:()=>true},radius:4.6,getSite:()=>site,getState:()=>state,science:{sample,size:100,legacyLayers:[],setLegacy:()=>{},route:()=>Array.from({length:11},(_,i)=>({x:i,z:0})),optimize:()=>optimized++},ensureOrbital:()=>{state.mode='orbital';},projection:{flyTo:()=>{}},syncLayer:()=>{}};
const gp=document.createElement('section'),manager=createScientificLayerManager(api,document.getElementById('host'),{panel:gp});manager.update();await wait(()=>manager.records.size===8);check('Eight unique controls and legends',manager.records.size===8&&document.querySelectorAll('[data-science-layer]').length===8);
for(const id of SCIENCE_IDS){manager.setLayer(id,true);if(id!=='traverse')await wait(()=>manager.records.get(id).out.textContent.includes('SIM ready'));manager.update();check(id+' independent toggle and explicit simulation provenance',manager.records.get(id).enabled&&document.querySelector(`[data-science-layer="${id}"]`).textContent.includes('No observation loaded'));manager.setLayer(id,false);manager.update();check(id+' disables without removing data',!manager.records.get(id).enabled);}
for(const id of SCIENCE_IDS)manager.setLayer(id,true);manager.update();check('All eight enabled together',Array.from(manager.records.values()).every(e=>e.enabled));check('Bounded cached meshes',group.children[0].children.filter(m=>m.isMesh).length===7);
for(const mode of ['global','rectangle','north','south']){api.tiles.rectangle=mode==='rectangle';manager.update();const meshes=group.children[0].children.filter(m=>m.isMesh);check(mode+' finite aligned overlay positions',meshes.length===7&&meshes.every(m=>Array.from(m.geometry.attributes.position.array).every(Number.isFinite)));const p=localToMars(-50,-50,site),expected=api.tiles.point(p.lat,p.lon);if(api.tiles.rectangle)expected.z=.006;else expected.multiplyScalar((4.6+.006)/4.6);const actual=new THREE.Vector3().fromBufferAttribute(meshes[0].geometry.attributes.position,0);check(mode+' northwest corner matches geographic transform',actual.distanceTo(expected)<1e-5);if(mode==='rectangle'){const g=meshes[0].geometry,a=g.attributes.position;check('Rectangle triangles never bridge longitude seam',Array.from(g.index.array).every((v,i,idx)=>i%3!==0||Math.max(a.getX(v),a.getX(idx[i+1]),a.getX(idx[i+2]))-Math.min(a.getX(v),a.getX(idx[i+1]),a.getX(idx[i+2]))<api.radius*2));}}
state.mode='hybrid';manager.update();check('Surface mode uses original terrain height',surfaceGroup.children[1].children.find(m=>m.isMesh).geometry.attributes.position.getY(0)===Math.fround(sample(-50,-50).height+.1));
const entry=manager.records.get('slope');entry.slider.value='.25';entry.slider.dispatchEvent(new Event('input'));check('Opacity affects both projections',surfaceGroup.children[1].children.filter(m=>m.isMesh)[1].material.opacity===.25);
document.querySelector('[data-save-route]').click();check('Comparison table has saved route',!document.querySelector('[data-route-comparison]').textContent.includes('Not saved'));document.querySelector('[data-existing-astar]').click();check('Existing A* delegated once',optimized===1);document.querySelector('[data-clear-comparison]').click();check('Comparison clear works',document.querySelector('[data-route-comparison]').textContent.includes('Not saved'));
check('East-positive dateline wrap',localToMars(50,0,site).lon<0);check('North equals negative local Z',localToMars(0,-1,site).lat>site.lat);
const m=compareRoute([{x:0,z:0},{x:150,z:0}],()=>({height:0}));check('Known 3.6km flat route and assumed resource units',m.distance===3600&&m.hours===1&&m.o2Percent===14&&m.energyKcal===300);check('Zero-length route unavailable',compareRoute([{x:0,z:0},{x:0,z:0}],()=>({height:0}))===null);
site.id=1;manager.update();await wait(()=>Array.from(manager.records.values()).every(e=>!e.busy));manager.update();check('Site change rebuilds bounded grid cache',group.children[0].children.filter(m=>m.isMesh).length===7);
const renderer=new THREE.WebGLRenderer();renderer.setSize(320,240);document.body.append(renderer.domElement);const camera=new THREE.PerspectiveCamera(45,4/3,.01,100);camera.position.set(0,0,14);state.mode='orbital';manager.update();renderer.render(scene,camera);check('Combined overlay WebGL render',renderer.info.render.calls>0);renderer.dispose();
api.science.sample=()=>({height:0,h:0,slope:0,get featureMask(){throw Error('Fixture sampling failure');}});state.relief=2;manager.update();await wait(()=>Array.from(manager.records.values()).every(e=>!e.busy));check('Sampling failure visibly disables affected rasters',SCIENCE_IDS.filter(id=>id!=='traverse').every(id=>!manager.records.get(id).enabled&&manager.records.get(id).out.textContent.includes('unavailable')));check('Sampling failure retains navigation toggle',manager.records.get('traverse').enabled);
document.getElementById('result').textContent=JSON.stringify({passed:checks.filter(c=>c.pass).length,total:checks.length,checks},null,2);
}catch(error){document.getElementById('result').textContent=JSON.stringify({error:error.stack,checks},null,2);}
</script></body></html>
