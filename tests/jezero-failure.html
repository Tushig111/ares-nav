<!doctype html><html><head><meta charset="utf-8"><title>Field lab failure recovery</title><script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script></head><body><h1>Field lab failure recovery</h1><pre id="result">Running…</pre><script type="module">
import * as THREE from 'three';import{createJezeroFieldLab}from'../js/jezero-fieldlab.js?v=final1';
const checks=[],check=(name,pass)=>{checks.push({name,pass});if(!pass)throw Error(name);};
try{const renderer=new THREE.WebGLRenderer();renderer.setSize(320,240);document.body.append(renderer.domElement);const hostControls={enabled:true};let active=false;const lab=createJezeroFieldLab({renderer,hostControls,onActive:v=>{active=v;}});const fetchOriginal=window.fetch;window.fetch=()=>Promise.resolve(new Response('Fixture missing data',{status:503}));await lab.open();check('Missing data yields a visible actionable message',document.querySelector('[data-load]').textContent.includes('Terrain unavailable'));check('Host controls are suspended while lab is open',!hostControls.enabled&&active);lab.close();check('Return restores host controls and clears lab mode',hostControls.enabled&&!active&&!lab.active);window.fetch=fetchOriginal;await lab.open();check('Retry successfully loads terrain',document.querySelector('[data-load]').textContent.includes('CTX terrain ready'));lab.update(.016);check('Retry uses real rendered geometry',renderer.info.render.triangles>70000);lab.close();check('Second close restores host again',hostControls.enabled&&!active);renderer.dispose();document.getElementById('result').textContent=JSON.stringify({passed:checks.length,total:6,checks},null,2);}catch(e){document.getElementById('result').textContent=JSON.stringify({error:e.stack,checks});}
</script></body></html>
