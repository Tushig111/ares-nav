<!doctype html><meta charset="utf-8"><title>ARES Trek navigation checks</title><style>body{background:#0b101c;color:#e9f4ff;font:13px/1.6 system-ui}pre{white-space:pre-wrap}canvas{width:800px;height:600px;max-width:100%;border:1px solid #456}</style><script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script><h1>Search, markers, navigation and pin checks</h1><pre id="results">Running…</pre><script type="module">
import {pickReferenceMap} from '../js/map-picking.js';import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {loadSearchCatalog,parseSearchCoordinates,filterSearchRecords} from '../js/official-data.js';import {createProjectionController} from '../js/projections.js';import {MarsQuadtreeGlobe,spherePoint,rectanglePoint} from '../js/mars-quadtree-globe.js';import {createSearchMarkers} from '../js/search-markers.js';import {createMeasurementTools} from '../js/measurement-tools.js';
const results=[];const assert=(v,m='Assertion failed')=>{if(!v)throw Error(m);};async function test(name,fn){try{await fn();results.push({name,passed:true});}catch(e){results.push({name,passed:false,error:e.message});}document.querySelector('#results').textContent=JSON.stringify({passed:results.filter(r=>r.passed).length,total:results.length,results},null,2);}
const data=await loadSearchCatalog();
await test('Complete downloaded Gazetteer contains 2055 valid approved feature centers',()=>assert(data.features.length===2055&&data.features.every(p=>Math.abs(p.lat)<=90&&Math.abs(p.lon)<=180)));
await test('Jezero official center rounds to separately verified Gazetteer values',()=>{const p=data.features.find(f=>f.id==='iau-14300');assert(p.lat.toFixed(2)==='18.41'&&p.lon.toFixed(2)==='77.69');});
await test('Four supplied bookmark groups retain all 42 approximate anchors',()=>assert(data.bookmarks.length===4&&data.bookmarks.flatMap(b=>b.points).length===42));
await test('Official NASA catalog has 146 distinct products, including Jezero controlled CTX and HiRISE',()=>assert(data.layers.length===146&&['JEZ_ctx_B_soc_008_orthoMosaic_6m_Eqc_latTs0_lon0','JEZ_hirise_soc_006_orthoMosaic_25cm_Eqc_latTs0_lon0_first_dd'].every(id=>data.layers.some(l=>l.productLabel===id))));
await test('Entered coordinates wrap east longitude consistently',()=>{const p=parseSearchCoordinates('18.4447, 357');assert(p.lat===18.4447&&p.lon===-3);});
await test('Out-of-range latitude is rejected',()=>{let threw=false;try{parseSearchCoordinates('91 77');}catch{threw=true;}assert(threw);});
await test('Metadata filter is distinct from title-only matching',()=>{const rows=[{name:'Image A',description:'smectite',kind:'layer'}];assert(filterSearchRecords(rows,{query:'smectite'}).length===0&&filterSearchRecords(rows,{query:'smectite',metadata:true}).length===1);});
await test('Spatial distance filter crosses the antimeridian correctly',()=>assert(filterSearchRecords([{name:'Near',lat:0,lon:-179},{name:'Far',lat:0,lon:-160}],{near:{lat:0,lon:179}}).length===1));
const canvas=document.createElement('canvas');canvas.width=800;canvas.height=600;canvas.setPointerCapture=()=>{};canvas.releasePointerCapture=()=>{};document.body.append(canvas);const camera=new THREE.PerspectiveCamera(42,4/3,.01,1600);camera.position.set(0,3,14);const controls=new OrbitControls(camera,canvas);controls.enableDamping=false;const globe=new THREE.Group();globe.rotation.z=.4396;const renderer={domElement:canvas,capabilities:{getMaxAnisotropy:()=>1},initTexture(){}};const tiles=new MarsQuadtreeGlobe({parent:globe,camera,renderer});const controller=createProjectionController({camera,controls,globe,tiles,enterOrbital(){},pauseMotion(){}});
const api={globe,camera,controls,tiles,canvas,radius:4.6,getState:()=>({mode:'orbital'}),globePoint:(lat,lon,r)=>{if(!tiles.rectangle)return spherePoint(lat,lon,r);const p=rectanglePoint(lat,lon,4.6);p.z=r-4.6;return p.applyQuaternion(tiles.group.quaternion);}};const markers=createSearchMarkers(api);
await test('Initial map has zero selected POI markers',()=>assert(markers.markerCount===0));
await test('Selecting Jezero creates precisely its eleven study POIs',()=>{markers.select(data.bookmarks[0]);markers.update();assert(markers.markerCount===11);});
await test('Hide Markers suppresses visible selected markers',()=>{markers.setHidden(true,true);markers.update();assert(markers.visibleMarkerCount===0);});
await test('Remove clears all selected POI geometry',()=>{markers.remove();assert(markers.markerCount===0&&markers.selected===null);});
controller.setMode('rectangle');camera.updateMatrixWorld();
await test('Orthographic left drag and one-finger touch use PAN',()=>assert(controls.mouseButtons.LEFT===THREE.MOUSE.PAN&&controls.touches.ONE===THREE.TOUCH.PAN));
const tick=()=>{controller.update(1/60);controls.update();camera.updateMatrixWorld();};
await test('Two-finger wheel scroll pans without changing zoom',()=>{const before=controls.target.clone(),zoom=camera.zoom;canvas.dispatchEvent(new WheelEvent('wheel',{deltaX:35,deltaY:20,bubbles:true,cancelable:true}));for(let i=0;i<90;i++)tick();assert(controls.target.distanceTo(before)>.01&&camera.zoom===zoom);});
await test('Ctrl-wheel pinch zoom anchors the same screen-plane location',()=>{const rect=canvas.getBoundingClientRect(),x=Math.round(rect.left+rect.width*.7),y=Math.round(rect.top+rect.height*.4),ndc=new THREE.Vector3((x-rect.left)/rect.width*2-1,-(y-rect.top)/rect.height*2+1,0),before=ndc.clone().unproject(camera),zoom=camera.zoom;canvas.dispatchEvent(new WheelEvent('wheel',{deltaY:-100,ctrlKey:true,clientX:x,clientY:y,bubbles:true,cancelable:true}));for(let i=0;i<90;i++)tick();const after=ndc.clone().unproject(camera);assert(camera.zoom>zoom&&before.distanceTo(after)<1e-5,'Cursor anchor moved '+before.distanceTo(after));});
await test('Fly To Area converges on the requested rectangle coordinate',()=>{controller.flyTo({lat:18.4447,lon:77.4508});for(let i=0;i<100;i++)tick();assert(Math.abs(controls.target.x-77.4508/180*9.2)<1e-5&&Math.abs(controls.target.y-18.4447/90*4.6)<1e-5);});
controller.setMode('global');await test('Global globe restores left-button rotation',()=>assert(controls.mouseButtons.LEFT===THREE.MOUSE.ROTATE&&controls.touches.ONE===THREE.TOUCH.ROTATE));
await test('Keyboard flight changes camera position only while enabled',()=>{const before=camera.position.clone();controller.toggleFly(true);dispatchEvent(new KeyboardEvent('keydown',{code:'KeyD'}));for(let i=0;i<15;i++)tick();dispatchEvent(new KeyboardEvent('keyup',{code:'KeyD'}));controller.toggleFly(false);assert(camera.position.distanceTo(before)>.001);});
for(const [mode,lat,lon]of [['global',12,-90],['rectangle',-12,77],['north',80,30],['south',-80,-120]])await test(mode+' reference-map picking returns known planetocentric coordinates',()=>{controller.setMode(mode);camera.updateMatrixWorld();globe.updateWorldMatrix(true,true);const world=tiles.point(lat,lon).applyMatrix4(tiles.group.matrixWorld),ndc=world.project(camera),picked=pickReferenceMap(new THREE.Vector2(ndc.x,ndc.y),camera,globe,tiles,4.6);assert(picked&&Math.abs(picked.lat-lat)<1e-6&&Math.abs(picked.lon-lon)<1e-6,JSON.stringify(picked));});
controller.setMode('rectangle');await test('Rectangle picking rejects coordinates beyond its longitude domain',()=>{camera.updateMatrixWorld();const ndc=new THREE.Vector3(9.4,0,0).project(camera);assert(pickReferenceMap(new THREE.Vector2(ndc.x,ndc.y),camera,globe,tiles,4.6)===null);});controller.setMode('global');
const fixture=document.createElement('section');fixture.innerHTML='<output data-measure-output></output><div data-vertices></div><select data-measure-mode><option>inspect</option><option>line</option></select><input type="checkbox" data-measure-enable><input type="checkbox" data-longitude><input data-lat><input data-lon><input data-edit-index>'+['add-coordinate','undo','redo','clear','export','share'].map(x=>`<button data-${x}>${x}</button>`).join('');document.body.append(fixture);let report=null;let next={lat:0,lon:0};const measure=createMeasurementTools({...api,cancelWaypoint(){},download(){},getView:()=>({}),restoreView(){},pick:()=>next,onMeasurement:m=>{report=m;}},fixture);
await test('One-click line measurement keeps map navigation enabled',()=>{measure.activate('line');assert(measure.enabled&&controls.enabled);});
function clickPin(p){next=p;canvas.dispatchEvent(new PointerEvent('pointerdown',{pointerId:1,clientX:40,clientY:40,bubbles:true}));canvas.dispatchEvent(new PointerEvent('pointerup',{pointerId:1,clientX:40,clientY:40,bubbles:true}));}
await test('Direct pin clicks report independent one-degree Mars arc distance',()=>{clickPin({lat:0,lon:0});clickPin({lat:0,lon:1});assert(report.points.length===2&&Math.abs(report.surface-2*Math.PI*3389500/360)<1e-6);});
await test('A drag does not drop an extra measurement pin',()=>{canvas.dispatchEvent(new PointerEvent('pointerdown',{pointerId:2,clientX:20,clientY:20,bubbles:true}));canvas.dispatchEvent(new PointerEvent('pointerup',{pointerId:2,clientX:80,clientY:20,bubbles:true}));assert(report.points.length===2);});
await test('A two-pointer gesture does not drop measurement pins',()=>{for(const id of [3,4])canvas.dispatchEvent(new PointerEvent('pointerdown',{pointerId:id,clientX:40,clientY:40,bubbles:true}));for(const id of [3,4])canvas.dispatchEvent(new PointerEvent('pointerup',{pointerId:id,clientX:40,clientY:40,bubbles:true}));assert(report.points.length===2);});
await test('Clear pins clears both geometry and total distance',()=>{measure.clear();assert(report.points.length===0&&report.surface===0);});
measure.activate('line',false);tiles.dispose();
</script>
