<!doctype html><meta charset="utf-8"><title>ARES final vehicle checks</title><script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script><style>body{background:#111823;color:#eee;font:14px system-ui}pre{white-space:pre-wrap}canvas{max-width:100%}</style><h1>GLB / launch verification</h1><pre id="result">Loading actual GLBs…</pre><script type="module">
import * as THREE from 'three';import {loadRover,flightState} from '../js/vehicles.js';
const results=[];const check=(name,value)=>results.push({name,passed:!!value});const r=new THREE.WebGLRenderer({antialias:true,stencil:true});r.setSize(900,500);document.body.append(r.domElement);const scene=new THREE.Scene();scene.background=new THREE.Color(0x111823);scene.add(new THREE.HemisphereLight(0xffffff,0x998877,3));const sun=new THREE.DirectionalLight(0xffffff,3);sun.position.set(3,6,5);scene.add(sun);const camera=new THREE.PerspectiveCamera(40,1.8,.01,100);camera.position.set(7,5,9);camera.lookAt(0,1,0);
for(const [i,name]of ['curiosity','curiosity-dirty','perseverance'].entries()){try{const model=await loadRover(name);const size=new THREE.Box3().setFromObject(model).getSize(new THREE.Vector3());check(name+' decodes and is 2.2m high',Math.abs(size.y-2.2)<1e-5);model.position.x=(i-1)*3;scene.add(model);}catch(e){results.push({name,passed:false,error:e.message});}document.querySelector('#result').textContent=JSON.stringify(results,null,2);r.render(scene,camera);}
check('Powered acceleration subtracts Mars gravity',Math.abs(flightState(1).acceleration-5.28)<1e-9);check('One second powered altitude is 2.64m',Math.abs(flightState(1).height-2.64)<1e-9);check('Burnout velocity is continuous',Math.abs(flightState(8).velocity-42.24)<1e-9);check('Ballistic coast accelerates down at 3.72m/s²',flightState(9).acceleration===-3.72);check('Ground collision clamps altitude',flightState(100).height===0);document.querySelector('#result').textContent=JSON.stringify({passed:results.filter(x=>x.passed).length,total:results.length,results},null,2);r.render(scene,camera);
</script>
