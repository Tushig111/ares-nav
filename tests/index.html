<!doctype html><meta charset="utf-8"><title>ARES core checks</title><style>body{background:#08101c;color:#e5edf5;font:14px/1.6 monospace;padding:30px}.fail{color:#ff8a8a}.pass{color:#65efbb}</style><h1>ARES core checks</h1><p id="summary">Running…</p><ol id="results"></ol><script type="module">import{runTests}from'./core-tests.js';const r=await runTests();for(const t of r){const li=document.createElement('li');li.className=t.passed?'pass':'fail';li.textContent=`${t.passed?'PASS':'FAIL'}: ${t.name}${t.error?' — '+t.error:''}`;document.querySelector('#results').append(li);}document.querySelector('#summary').textContent=`${r.filter(x=>x.passed).length}/${r.length} passed`;</script>
